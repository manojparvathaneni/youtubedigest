# YouTube Daily Digest Configuration
# ==================================

# Output format: markdown, html, or both
output_format: markdown

# Output directory for generated files (created if doesn't exist)
output_dir: blog

# ============================================================
# LLM Configuration
# ============================================================
# Uses LiteLLM for unified access to multiple providers.
# See: https://docs.litellm.ai/docs/providers
#
# Examples:
#   Anthropic:  claude-sonnet-4-5-20250929, claude-3-5-sonnet-20241022
#   OpenAI:     gpt-4o, gpt-4o-mini, gpt-3.5-turbo
#   Ollama:     ollama/llama3, ollama/mistral, ollama/phi3
#   OpenRouter: openrouter/anthropic/claude-3-opus
#
# For Ollama/local models, also set api_base below.
model: claude-haiku-4-5

# Max tokens for blog post generation (increase for longer videos)
# Default: 8192 (good for 2-3 hour videos)
# Reduce for models with smaller context windows
max_tokens: 8192

# Number of videos to process per channel (default)
# Options: 1-15 (RSS feed limit), or "all" for all 15
videos_per_channel: 1

# Channels to monitor
# Run `python get_subscriptions.py` to auto-populate this list
#
# Per-channel override: add "videos: N" to fetch more from specific channels
channels:
  # Format:
  # - id: CHANNEL_ID
  #   name: Channel Name
  #   videos: 5  # optional override
  
  # Example channels (replace with your own):
  - id: UCsBjURrPoezykLs9EqgamOA
    name: Fireship
  
  - id: UCVHFbqXqoYvEWM1Ddxl0QDg
    name: Alex Ziskind

  - id: UCXl4i9dYBrFOabk0xGmbkRA
    name: Dwarkesh Patel
    videos: 3  # Fetch last 3 videos from Dwarkesh

  # Add more channels here...
